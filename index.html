<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>پونه | طراحی گرافیک و برندینگ</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;700;900&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #D0E8D0;
            color: #2B4E3B;
            direction: rtl;
        }

        .header {
            background-color: #2B4E3B;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 28px;
            font-weight: 900;
            color: #F9F6F0;
            letter-spacing: 2px;
        }

        .logo span {
            color: #C49A6C;
        }

        .nav a {
            color: #F9F6F0;
            text-decoration: none;
            margin: 0 12px;
            font-weight: 300;
            font-size: 16px;
            transition: 0.3s;
        }

        .nav a:hover {
            color: #C49A6C;
        }

        .banner-container {
            max-width: 1300px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .banner {
            width: 100%;
            height: 400px;
            border-radius: 20px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .banner-1 {
            background: linear-gradient(135deg, #D0E8D0 0%, #8FBC8F 100%);
            border-right: 8px solid #C49A6C;
        }

        .banner-1 h1 {
            font-size: 72px;
            font-weight: 900;
            color: #2B4E3B;
        }

        .banner-1 .sub {
            font-size: 22px;
            font-weight: 300;
            color: #4A7C59;
            margin-top: 8px;
        }

        .banner-1 .line {
            width: 120px;
            height: 3px;
            background: #C49A6C;
            margin: 12px auto 0;
        }

        .banner-2 {
            background: linear-gradient(135deg, #4A7C59 0%, #2B4E3B 100%);
            color: #F9F6F0;
        }

        .banner-2 h2 {
            font-size: 48px;
            font-weight: 900;
            color: #F9F6F0;
        }

        .banner-2 .sub {
            font-size: 20px;
            font-weight: 300;
            color: #D0E8D0;
            margin-top: 10px;
        }

        .banner-2 .line {
            width: 100px;
            height: 3px;
            background: #C49A6C;
            margin: 12px auto 0;
        }

        .banner-3 {
            background: linear-gradient(135deg, #D0E8D0 0%, #F9F6F0 100%);
            border-left: 8px solid #C49A6C;
        }

        .banner-3 h2 {
            font-size: 48px;
            font-weight: 900;
            color: #2B4E3B;
        }

        .banner-3 .sub {
            font-size: 20px;
            font-weight: 300;
            color: #4A7C59;
            margin-top: 10px;
        }

        .banner-3 .line {
            width: 100px;
            height: 3px;
            background: #C49A6C;
            margin: 12px auto 0;
        }

        .footer {
            background-color: #2B4E3B;
            color: #D0E8D0;
            text-align: center;
            padding: 30px 20px;
            font-weight: 300;
            font-size: 14px;
            border-top: 3px solid #C49A6C;
        }

        .footer span {
            color: #C49A6C;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 12px;
                padding: 16px 20px;
            }

OPRATOR, [01/05/1405 02:19 ب.ظ]
.nav a {
                margin: 0 8px;
                font-size: 14px;
            }

            .banner {
                height: 280px;
                padding: 20px;
            }

            .banner-1 h1 {
                font-size: 40px;
            }

            .banner-2 h2,
            .banner-3 h2 {
                font-size: 30px;
            }

            .banner-1 .sub,
            .banner-2 .sub,
            .banner-3 .sub {
                font-size: 16px;
            }
        }

        @media (max-width: 480px) {
            .banner {
                height: 220px;
            }

            .banner-1 h1 {
                font-size: 28px;
            }

            .banner-2 h2,
            .banner-3 h2 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo">پونه <span>|</span> طراحی</div>
        <nav class="nav">
            <a href="#">خانه</a>
            <a href="#">نمونهکارها</a>
            <a href="#">درباره من</a>
            <a href="#">تماس</a>
        </nav>
    </header>

    <div class="banner-container">

        <div class="banner banner-1">
            <h1>پونه</h1>
            <div class="sub">طراحی گرافیک و برندینگ</div>
            <div class="line"></div>
        </div>

        <div class="banner banner-2">
            <h2>طراحی به کمک هوش مصنوعی</h2>
            <div class="sub">دقت و سرعت، بدون کاهش کیفیت</div>
            <div class="line"></div>
        </div>

        <div class="banner banner-3">
            <h2>هر پروژه، یک هویت</h2>
            <div class="sub">طراحی اختصاصی برای برند شما</div>
            <div class="line"></div>
        </div>

    </div>

    <footer class="footer">
        © ۲۰۲۶ <span>پونه</span> — طراحی گرافیک و برندینگ
    </footer>

</body>
</html>
